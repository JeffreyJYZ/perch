[package]
name = "perch-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "perch"
path = "src/main.rs"

[dependencies]
rune = { path = "../../../../experiments/rune/crates/rune" }
perch-store = { path = "../perch-store" }
perch-ui = { path = "../perch-ui" }
perch-term = { path = "../perch-term" }
perch-agent = { path = "../perch-agent" }
perch-tools = { path = "../perch-tools" }
perch-files = { path = "../perch-files" }
perch-plugins = { path = "../perch-plugins" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
