[package]
name = "perch-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "perch"
path = "src/main.rs"

[dependencies]
# The folder picker is Rune's native sheet: without this feature the runtime answers the
# picker with an error and a window that opened with no folder could never get one.
rune = { path = "../../../../experiments/rune/crates/rune", features = ["native-file-dialog"] }
perch-store = { path = "../perch-store" }
perch-ui = { path = "../perch-ui" }
perch-term = { path = "../perch-term" }
perch-agent = { path = "../perch-agent" }
perch-tools = { path = "../perch-tools" }
perch-files = { path = "../perch-files" }
perch-plugins = { path = "../perch-plugins" }
perch-mcp = { path = "../perch-mcp" }
perch-board = { path = "../perch-board" }
perch-codemode = { path = "../perch-codemode" }
perch-web = { path = "../perch-web" }
perch-update = { path = "../perch-update" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
arc-swap = "1"
notify = "8"

[dev-dependencies]
tempfile = "3"
