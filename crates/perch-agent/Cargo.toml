[package]
name = "perch-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
perch-tools = { path = "../perch-tools" }
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
