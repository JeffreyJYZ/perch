[package]
name = "perch-plugins"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
perch-store = { path = "../perch-store" }
perch-tools = { path = "../perch-tools" }
wasmtime = "50"
wasmtime-wasi = "50"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
